services:
  web:
    build:
      context: ..
      dockerfile: docker/web/Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_API_BASE_URL: /api
    ports:
      - "3000:80"
    depends_on:
      - api

  api:
    build:
      context: ..
      dockerfile: docker/api/Dockerfile
    ports:
      - "4001:4001"
    env_file:
      - ../apps/api/.env
